<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Sistem Data Yayasan - Anak Asuh</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            padding: 24px;
            margin-bottom: 30px;
        }

        h1 {
            color: #333;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 24px;
            border-left: 4px solid #764ba2;
            padding-left: 12px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 24px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
        }

        .form-group input, .form-group select {
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
        }

        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: #764ba2;
        }

        .form-group input[readonly] {
            background-color: #f5f5f5;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 28px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .filter-section {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .filter-select {
            padding: 10px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            background: white;
            cursor: pointer;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px;
            text-align: left;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid #e0e0e0;
        }

        tr:hover {
            background-color: #f9f9f9;
        }

        .alert {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
        }

        .alert-error {
            background: #f8d7da;
            color: #721c24;
        }

        .empty-row td {
            text-align: center;
            color: #999;
            padding: 40px;
        }

        @media (max-width: 768px) {
            .card {
                padding: 16px;
            }
            th, td {
                padding: 8px;
                font-size: 0.8rem;
            }
            .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>📋 Data Yayasan</h1>
            <div class="subtitle">Form input data anak asuh</div>
            
            <div id="messageArea"></div>
            
            <div class="form-grid">
                <div class="form-group">
                    <label>Nama Anak Asuh *</label>
                    <input type="text" id="namaAsuh" placeholder="Masukkan nama anak asuh">
                </div>
                <div class="form-group">
                    <label>Jenjang Pendidikan *</label>
                    <select id="jenjang">
                        <option value="">Pilih jenjang</option>
                        <option value="SD">SD</option>
                        <option value="SMP">SMP</option>
                        <option value="SMA">SMA</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Jenis Kelamin *</label>
                    <select id="gender">
                        <option value="">Pilih jenis kelamin</option>
                        <option value="Laki-laki">Laki-laki</option>
                        <option value="Perempuan">Perempuan</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Biaya Diterima (Otomatis)</label>
                    <input type="text" id="biaya" readonly value="Rp 0">
                </div>
            </div>
            
            <button class="btn" onclick="simpanData()">💾 Simpan Data</button>
        </div>
        
        <div class="card">
            <h2>📊 Seluruh Data Anak</h2>
            <div class="subtitle">Data yang sudah tersimpan di Google Sheets</div>
            
            <div class="filter-section">
                <label>🔍 Filter Jenjang:</label>
                <select id="filterJenjang" class="filter-select" onchange="loadData()">
                    <option value="all">Semua</option>
                    <option value="SD">SD</option>
                    <option value="SMP">SMP</option>
                    <option value="SMA">SMA</option>
                </select>
            </div>
            
            <div class="table-wrapper">
                <table id="dataTable">
                    <thead>
                        <tr>
                            <th>Nama Anak Asuh</th>
                            <th>Jenjang</th>
                            <th>Jenis Kelamin</th>
                            <th>Biaya Diterima</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <tr class="empty-row">
                            <td colspan="4">Loading data...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw_a_AZbdLHOYbzK8aI-REmlIp5UBGqkLOOU1HbQXY1sFcMOIArCin-vu-yRGllyLbs7A/exec";
        
        const biayaMapping = {
            "SD": "Rp 300.000",
            "SMP": "Rp 400.000",
            "SMA": "Rp 500.000"
        };
        
        document.getElementById("jenjang").addEventListener("change", function() {
            const jenjang = this.value;
            const biayaField = document.getElementById("biaya");
            biayaField.value = biayaMapping[jenjang] || "Rp 0";
        });
        
        function showMessage(text, type) {
            const messageArea = document.getElementById("messageArea");
            messageArea.innerHTML = `<div class="alert alert-${type}">${text}</div>`;
            setTimeout(() => {
                messageArea.innerHTML = "";
            }, 3000);
        }
        
        async function simpanData() {
            const namaAsuh = document.getElementById("namaAsuh").value.trim();
            const jenjang = document.getElementById("jenjang").value;
            const gender = document.getElementById("gender").value;
            const biaya = document.getElementById("biaya").value;
            
            if (!namaAsuh || !jenjang || !gender) {
                showMessage("Harap isi semua field!", "error");
                return;
            }
            
            const data = {
                action: "add",
                namaAsuh: namaAsuh,
                jenjang: jenjang,
                gender: gender,
                biaya: biaya,
                timestamp: new Date().toISOString()
            };
            
            try {
                showMessage("Menyimpan data...", "success");
                await fetch(APPS_SCRIPT_URL, {
                    method: "POST",
                    mode: "no-cors",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(data)
                });
                
                showMessage("✅ Data berhasil disimpan!", "success");
                
                document.getElementById("namaAsuh").value = "";
                document.getElementById("jenjang").value = "";
                document.getElementById("gender").value = "";
                document.getElementById("biaya").value = "Rp 0";
                
                setTimeout(loadData, 1000);
                
            } catch (error) {
                console.error(error);
                showMessage("❌ Gagal menyimpan data.", "error");
            }
        }
        
        async function loadData() {
            const filter = document.getElementById("filterJenjang").value;
            const tableBody = document.getElementById("tableBody");
            tableBody.innerHTML = '<tr class="empty-row"><td colspan="4">Loading...</td></tr>';
            
            try {
                const url = `${APPS_SCRIPT_URL}?action=get&filter=${filter}`;
                const response = await fetch(url);
                const data = await response.json();
                
                if (!data || data.length === 0) {
                    tableBody.innerHTML = '<tr class="empty-row"><td colspan="4">Belum ada data</td></tr>';
                    return;
                }
                
                tableBody.innerHTML = "";
                data.forEach(row => {
                    const tr = document.createElement("tr");
                    tr.innerHTML = `
                        <td>${escapeHtml(row.namaAsuh)}</td>
                        <td>${escapeHtml(row.jenjang)}</td>
                        <td>${escapeHtml(row.gender)}</td>
                        <td>${escapeHtml(row.biaya)}</td>
                    `;
                    tableBody.appendChild(tr);
                });
                
            } catch (error) {
                console.error(error);
                tableBody.innerHTML = '<tr class="empty-row"><td colspan="4">Gagal memuat data</td></tr>';
            }
        }
        
        function escapeHtml(str) {
            if (!str) return "";
            return str.replace(/[&<>]/g, function(m) {
                if (m === "&") return "&amp;";
                if (m === "<") return "&lt;";
                if (m === ">") return "&gt;";
                return m;
            });
        }
        
        loadData();
    </script>
</body>
</html>
