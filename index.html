<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Anak Asuh Yayasan</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #667eea; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        .card { background: white; border-radius: 16px; padding: 24px; margin-bottom: 20px; }
        input, select { width: 100%; padding: 10px; margin: 8px 0 16px; border: 1px solid #ddd; border-radius: 8px; }
        button { background: #667eea; color: white; padding: 12px 24px; border: none; border-radius: 8px; cursor: pointer; }
        button:hover { background: #5a67d8; }
        .btn-hapus { background: #e53e3e; padding: 6px 12px; font-size: 12px; }
        .btn-hapus:hover { background: #c53030; }
        .btn-logout { background: #e53e3e; padding: 8px 16px; font-size: 14px; margin-left: 10px; }
        .btn-admin { background: #38a169; padding: 8px 16px; font-size: 14px; margin-left: 10px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background: #667eea; color: white; }
        .error { color: red; }
        .success { color: green; }
        .login-container { 
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .login-card {
            background: white;
            padding: 40px;
            border-radius: 16px;
            width: 100%;
            max-width: 400px;
        }
        .login-card h2 {
            text-align: center;
            margin-bottom: 24px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .main-content {
            display: none;
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        @media (max-width: 768px) {
            .form-row {
                grid-template-columns: 1fr;
            }
        }
        .status-badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: bold;
        }
        .status-yatim-piatu { background: #fef3c7; color: #92400e; }
        .status-yatim { background: #dbeafe; color: #1e40af; }
        .status-piatu { background: #e0e7ff; color: #3730a3; }
        .status-disabilitas { background: #fce7f3; color: #9d174d; }
        .status-lainnya { background: #e5e7eb; color: #374151; }
        .required::after { content: " *"; color: red; }
    </style>
</head>
<body>

<!-- Halaman Login -->
<div id="loginPage" class="login-container">
    <div class="login-card">
        <h2>🔐 Login Sistem Data Yayasan</h2>
        <div id="loginMsg"></div>
        <input type="text" id="username" placeholder="Username">
        <input type="password" id="password" placeholder="Password">
        <button onclick="login()">Login</button>
        <p style="text-align: center; margin-top: 15px; font-size: 12px; color: #888;">Demo: admin / admin123</p>
    </div>
</div>

<!-- Halaman Utama -->
<div id="mainPage" class="main-content">
    <div class="container">
        <div class="card">
            <div class="header">
                <h2>📋 Data Anak Asuh Yayasan</h2>
                <div class="user-info">
                    <span>👤 <span id="loggedUser"></span></span>
                    <button class="btn-logout" onclick="logout()">Logout</button>
                </div>
            </div>
            <div id="msg"></div>
            
            <div class="form-row">
                <div>
                    <label class="required">👤 Nama Anak Asuh</label>
                    <input type="text" id="nama" placeholder="Nama lengkap anak asuh">
                </div>
                <div>
                    <label>🆔 No. Anak Asuh</label>
                    <input type="text" id="noAnak" placeholder="Nomor urut anak asuh">
                </div>
            </div>

            <div class="form-row">
                <div>
                    <label>👪 Nama Orang Tua Asuh</label>
                    <input type="text" id="ortuAsuh" placeholder="Nama orang tua asuh">
                </div>
                <div>
                    <label>📋 Nama Pendamping Lokal</label>
                    <input type="text" id="pendamping" placeholder="Nama pendamping lokal">
                </div>
            </div>

            <div class="form-row">
                <div>
                    <label class="required">📚 Jenjang Pendidikan</label>
                    <select id="jenjang">
                        <option value="">Pilih Jenjang</option>
                        <option value="SD">SD</option>
                        <option value="SD/MI">SD/MI</option>
                        <option value="SMP">SMP</option>
                        <option value="SMPLB">SMPLB</option>
                        <option value="MTs">MTs</option>
                        <option value="SMA">SMA</option>
                        <option value="SMK">SMK</option>
                        <option value="Universitas">Universitas</option>
                    </select>
                </div>
                <div>
                    <label class="required">💰 Nominal Sponsor</label>
                    <input type="text" id="biaya" placeholder="Biaya sponsor" readonly>
                </div>
            </div>

            <div class="form-row">
                <div>
                    <label class="required">📌 Status Anak</label>
                    <select id="status">
                        <option value="">Pilih Status</option>
                        <option value="Yatim Piatu">Yatim Piatu</option>
                        <option value="Yatim">Yatim</option>
                        <option value="Piatu">Piatu</option>
                        <option value="Disabilitas">Disabilitas</option>
                        <option value="Anak terlantar">Anak terlantar</option>
                        <option value="Anak dari keluarga tidak mampu">Anak dari keluarga tidak mampu</option>
                    </select>
                </div>
            </div>

            <button onclick="simpan()">➕ Simpan Data</button>
        </div>
        
        <div class="card">
            <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; margin-bottom: 20px;">
                <h2>📊 Data Anak Asuh</h2>
                <select id="filter" onchange="loadData()">
                    <option value="all">Semua Jenjang</option>
                    <option value="SD">SD</option>
                    <option value="SMP">SMP</option>
                    <option value="SMA">SMA</option>
                    <option value="Universitas">Universitas</option>
                </select>
            </div>
            <div style="overflow-x: auto;">
                <table id="tabel">
                    <thead>
                        <tr>
                            <th>NO</th>
                            <th>Nama Orang Tua Asuh</th>
                            <th>Nama Pendamping</th>
                            <th>No Anak</th>
                            <th>Nama Anak Asuh</th>
                            <th>Status</th>
                            <th>Jenjang</th>
                            <th>Nominal Sponsor</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>
                    <tbody><tr><td colspan="9">⏳ Loading...</td></tr>
                </tbody>
            </table>
            </div>
        </div>
    </div>
</div>

<script>
// ============== KONFIGURASI ==============
const API_URL = "https://script.google.com/macros/s/AKfycbxYECiLwB7b52sBxrI_qnv6JoP2GZ6bDMEqf6IxXo8b5EVpwqkqQnInLyKXJS2Rue0j/exec";

// Data user
let USERS = JSON.parse(localStorage.getItem("yayasan_users")) || {
    "admin": "admin123",
    "yayasan": "yayasan2024"
};

// Map biaya berdasarkan jenjang
const biayaMap = { 
    "SD": "400000",
    "SD/MI": "400000",
    "SMP": "500000",
    "SMPLB": "500000",
    "MTs": "500000",
    "SMA": "600000", 
    "SMK": "600000",
    "Universitas": "600000"
};

// ============== FUNGSI LOGIN ==============
function saveUsers() {
    localStorage.setItem("yayasan_users", JSON.stringify(USERS));
}

window.onload = function() {
    const isLoggedIn = sessionStorage.getItem("isLoggedIn");
    const username = sessionStorage.getItem("username");
    if (isLoggedIn === "true" && username) {
        document.getElementById("loginPage").style.display = "none";
        document.getElementById("mainPage").style.display = "block";
        document.getElementById("loggedUser").innerText = username;
        loadData();
    } else {
        document.getElementById("loginPage").style.display = "flex";
        document.getElementById("mainPage").style.display = "none";
    }
};

function login() {
    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value;
    const loginMsg = document.getElementById("loginMsg");
    
    if (!username || !password) {
        loginMsg.innerHTML = "<div class='error'>⚠️ Isi username dan password!</div>";
        return;
    }
    
    if (USERS[username] && USERS[username] === password) {
        sessionStorage.setItem("isLoggedIn", "true");
        sessionStorage.setItem("username", username);
        document.getElementById("loginPage").style.display = "none";
        document.getElementById("mainPage").style.display = "block";
        document.getElementById("loggedUser").innerText = username;
        loginMsg.innerHTML = "";
        loadData();
    } else {
        loginMsg.innerHTML = "<div class='error'>❌ Username atau password salah!</div>";
    }
}

function logout() {
    sessionStorage.clear();
    document.getElementById("loginPage").style.display = "flex";
    document.getElementById("mainPage").style.display = "none";
    document.getElementById("username").value = "";
    document.getElementById("password").value = "";
}

// ============== FUNGSI UTAMA ==============
function formatRupiah(angka) {
    if (!angka && angka !== 0) return "Rp 0";
    let number = String(angka).replace(/[^0-9]/g, '');
    if (!number || number === "0") return "Rp 0";
    return "Rp " + Number(number).toLocaleString('id-ID');
}

function cleanRupiah(rupiah) {
    if (!rupiah) return "0";
    return String(rupiah).replace(/[^0-9]/g, '');
}

document.getElementById("jenjang").onchange = function() {
    const biayaValue = biayaMap[this.value] || "400000";
    document.getElementById("biaya").value = formatRupiah(biayaValue);
};

async function simpan() {
    const noAnak = document.getElementById("noAnak").value.trim();
    const ortuAsuh = document.getElementById("ortuAsuh").value.trim();
    const pendamping = document.getElementById("pendamping").value.trim();
    const nama = document.getElementById("nama").value.trim();
    const status = document.getElementById("status").value;
    const jenjang = document.getElementById("jenjang").value;
    const biayaDisplay = document.getElementById("biaya").value;
    
    // Validasi
    if (!nama) {
        document.getElementById("msg").innerHTML = "<div class='error'>⚠️ Nama Anak Asuh wajib diisi!</div>";
        return;
    }
    if (!jenjang) {
        document.getElementById("msg").innerHTML = "<div class='error'>⚠️ Jenjang Pendidikan wajib dipilih!</div>";
        return;
    }
    if (!status) {
        document.getElementById("msg").innerHTML = "<div class='error'>⚠️ Status Anak wajib dipilih!</div>";
        return;
    }
    
    const biayaAngka = cleanRupiah(biayaDisplay);
    document.getElementById("msg").innerHTML = "<div>💾 Menyimpan data...</div>";
    
    try {
        const response = await fetch(API_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ 
                action: "add", 
                noAnak: noAnak,
                ortuAsuh: ortuAsuh,
                pendamping: pendamping,
                namaAsuh: nama, 
                status: status,
                jenjang: jenjang, 
                biaya: biayaAngka 
            })
        });
        
        const result = await response.json();
        console.log("Response:", result);
        
        if (result.status === "success") {
            document.getElementById("msg").innerHTML = "<div class='success'>✅ " + (result.message || "Data berhasil disimpan!") + "</div>";
            // Reset form
            document.getElementById("noAnak").value = "";
            document.getElementById("ortuAsuh").value = "";
            document.getElementById("pendamping").value = "";
            document.getElementById("nama").value = "";
            document.getElementById("status").value = "";
            document.getElementById("jenjang").value = "";
            document.getElementById("biaya").value = "Rp 0";
            loadData();
        } else {
            document.getElementById("msg").innerHTML = "<div class='error'>❌ Gagal: " + (result.message || "Unknown error") + "</div>";
        }
    } catch(e) {
        console.error("Error:", e);
        document.getElementById("msg").innerHTML = "<div class='error'>❌ Gagal menyimpan: " + e.message + "</div>";
    }
}

async function hapusData(index) {
    if (!confirm("Apakah Anda yakin ingin menghapus data ini?")) return;
    
    const msgDiv = document.getElementById("msg");
    msgDiv.innerHTML = "<div>🗑️ Menghapus data...</div>";
    
    try {
        const response = await fetch(API_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ action: "delete", index: index })
        });
        const result = await response.json();
        
        if (result.status === "success") {
            msgDiv.innerHTML = "<div class='success'>✅ Data berhasil dihapus!</div>";
            loadData();
        } else {
            msgDiv.innerHTML = "<div class='error'>❌ Gagal menghapus: " + (result.message || "Unknown error") + "</div>";
        }
    } catch(e) {
        msgDiv.innerHTML = "<div class='error'>❌ Gagal menghapus: " + e.message + "</div>";
    }
}

function getStatusClass(status) {
    const statusMap = {
        'Yatim Piatu': 'status-yatim-piatu',
        'Yatim': 'status-yatim',
        'Piatu': 'status-piatu',
        'Disabilitas': 'status-disabilitas'
    };
    return statusMap[status] || 'status-lainnya';
}

async function loadData() {
    const filterJenjang = document.getElementById("filter").value;
    const tbody = document.querySelector("#tabel tbody");
    tbody.innerHTML = "<tr><td colspan='9'>⏳ Loading...</td></tr>";
    
    try {
        const url = `${API_URL}?action=get&filter=${filterJenjang}`;
        console.log("Fetching:", url);
        
        const response = await fetch(url);
        const data = await response.json();
        
        console.log("Data:", data);
        
        if (!data || data.length === 0) {
            tbody.innerHTML = "<tr><td colspan='9'>📭 Belum ada data</td></tr>";
            return;
        }
        
        tbody.innerHTML = "";
        for (let i = 0; i < data.length; i++) {
            const row = data[i];
            const statusClass = getStatusClass(String(row.status || ""));
            
            tbody.innerHTML += `
                <tr>
                    <td>${escapeHtml(String(row.no || i+1))}</td>
                    <td>${escapeHtml(String(row.ortuAsuh || ""))}</td>
                    <td>${escapeHtml(String(row.pendamping || ""))}</td>
                    <td>${escapeHtml(String(row.noAnak || ""))}</td>
                    <td><strong>${escapeHtml(String(row.namaAsuh || ""))}</strong></td>
                    <td><span class="status-badge ${statusClass}">${escapeHtml(String(row.status || ""))}</span></td>
                    <td>${escapeHtml(String(row.jenjang || ""))}</td>
                    <td>${formatRupiah(row.biaya || "0")}</td>
                    <td><button class="btn-hapus" onclick="hapusData(${i})">🗑️ Hapus</button></td>
                </tr>
            `;
        }
    } catch(e) {
        console.error("Error:", e);
        tbody.innerHTML = `<tr><td colspan='9'>❌ Error: ${e.message}</td></tr>`;
    }
}

function escapeHtml(str) {
    if (str === undefined || str === null) return "";
    return String(str).replace(/[&<>]/g, function(m) {
        if (m === "&") return "&amp;";
        if (m === "<") return "&lt;";
        if (m === ">") return "&gt;";
        return m;
    });
}
</script>
</body>
</html>
