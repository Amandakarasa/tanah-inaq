<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Yayasan</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #667eea; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; }
        .card { background: white; border-radius: 16px; padding: 24px; margin-bottom: 20px; }
        input, select { width: 100%; padding: 10px; margin: 8px 0 16px; border: 1px solid #ddd; border-radius: 8px; }
        button { background: #667eea; color: white; padding: 12px 24px; border: none; border-radius: 8px; cursor: pointer; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background: #667eea; color: white; }
        .error { color: red; }
        .success { color: green; }
    </style>
</head>
<body>
<div class="container">
    <div class="card">
        <h2>Tambah Data Anak Asuh</h2>
        <div id="msg"></div>
        <input type="text" id="nama" placeholder="Nama Anak Asuh">
        <select id="jenjang">
            <option value="">Pilih Jenjang</option>
            <option value="SD">SD</option>
            <option value="SMP">SMP</option>
            <option value="SMA">SMA</option>
        </select>
        <select id="gender">
            <option value="">Pilih Jenis Kelamin</option>
            <option value="Laki-laki">Laki-laki</option>
            <option value="Perempuan">Perempuan</option>
        </select>
        <input type="text" id="biaya" placeholder="Biaya" readonly>
        <button onclick="simpan()">Simpan Data</button>
    </div>
    
    <div class="card">
        <h2>Data Anak Asuh</h2>
        <select id="filter" onchange="loadData()">
            <option value="all">Semua</option>
            <option value="SD">SD</option>
            <option value="SMP">SMP</option>
            <option value="SMA">SMA</option>
        </select>
        <table id="tabel">
            <thead><tr><th>Nama</th><th>Jenjang</th><th>Gender</th><th>Biaya</th></tr></thead>
            <tbody><tr><td colspan="4">Loading...</td></tr>
        </table>
    </div>
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbxP1BFPhs5k7Lt0KzR7T1t6d-CmRrhMWEYBqvyN0Nyl21uZSANlmCsEGo1rSE60rZCYdg/exec";

const biayaMap = { "SD": "Rp 300.000", "SMP": "Rp 400.000", "SMA": "Rp 500.000" };

document.getElementById("jenjang").onchange = function() {
    document.getElementById("biaya").value = biayaMap[this.value] || "Rp 0";
};

async function simpan() {
    const nama = document.getElementById("nama").value.trim();
    const jenjang = document.getElementById("jenjang").value;
    const gender = document.getElementById("gender").value;
    const biaya = document.getElementById("biaya").value;
    
    if (!nama || !jenjang || !gender) {
        document.getElementById("msg").innerHTML = "<div class='error'>Isi semua data!</div>";
        return;
    }
    
    document.getElementById("msg").innerHTML = "<div>Menyimpan...</div>";
    
    try {
        const response = await fetch(API_URL, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ action: "add", namaAsuh: nama, jenjang: jenjang, gender: gender, biaya: biaya })
        });
        
        document.getElementById("msg").innerHTML = "<div class='success'>Berhasil disimpan!</div>";
        document.getElementById("nama").value = "";
        document.getElementById("jenjang").value = "";
        document.getElementById("gender").value = "";
        document.getElementById("biaya").value = "Rp 0";
        setTimeout(loadData, 1000);
    } catch(e) {
        document.getElementById("msg").innerHTML = "<div class='error'>Gagal: " + e.message + "</div>";
    }
}

async function loadData() {
    const filter = document.getElementById("filter").value;
    const tbody = document.querySelector("#tabel tbody");
    tbody.innerHTML = "<tr><td colspan='4'>Loading...</td></tr>";
    
    try {
        const url = `${API_URL}?action=get&filter=${filter}`;
        const response = await fetch(url);
        const data = await response.json();
        
        if (!data || data.length === 0) {
            tbody.innerHTML = "<tr><td colspan='4'>Belum ada data</td></tr>";
            return;
        }
        
        tbody.innerHTML = "";
        for (let row of data) {
            // Perbaikan: konversi semua nilai ke string dengan aman
            const namaAsuh = String(row.namaAsuh || "");
            const jenjang = String(row.jenjang || "");
            const gender = String(row.gender || "");
            const biaya = String(row.biaya || "");
            
            tbody.innerHTML += `<tr>
                <td>${escapeHtml(namaAsuh)}</td>
                <td>${escapeHtml(jenjang)}</td>
                <td>${escapeHtml(gender)}</td>
                <td>${escapeHtml(biaya)}</td>
            </tr>`;
        }
    } catch(e) {
        tbody.innerHTML = `<tr><td colspan='4'>Error: ${e.message}</td></tr>`;
    }
}

// Perbaikan fungsi escapeHtml untuk handle non-string
function escapeHtml(str) {
    if (str === undefined || str === null) return "";
    const s = String(str);
    return s.replace(/[&<>]/g, function(m) {
        if (m === "&") return "&amp;";
        if (m === "<") return "&lt;";
        if (m === ">") return "&gt;";
        return m;
    });
}

loadData();
</script>
</body>
</html>
