<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Sistem Data Yayasan - Anak Asuh & Rentan</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* Card Style */
        .card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            padding: 24px;
            margin-bottom: 30px;
        }

        h1 {
            color: #333;
            margin-bottom: 8px;
            font-size: 1.8rem;
        }

        .subtitle {
            color: #666;
            margin-bottom: 24px;
            border-left: 4px solid #764ba2;
            padding-left: 12px;
        }

        /* Form Grid */
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 24px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
            font-size: 0.9rem;
        }

        .form-group input, .form-group select {
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.3s;
        }

        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: #764ba2;
            box-shadow: 0 0 0 3px rgba(118,75,162,0.1);
        }

        .form-group input[readonly] {
            background-color: #f5f5f5;
            cursor: not-allowed;
        }

        /* Button */
        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 28px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .btn:active {
            transform: translateY(0);
        }

        /* Filter */
        .filter-section {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .filter-section label {
            font-weight: 600;
            color: #333;
        }

        .filter-select {
            padding: 10px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            background: white;
            cursor: pointer;
        }

        /* Table */
        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }

        th {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px;
            text-align: left;
            font-weight: 600;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid #e0e0e0;
        }

        tr:hover {
            background-color: #f9f9f9;
        }

        /* Loading & Message */
        .loading {
            text-align: center;
            padding: 20px;
            color: #666;
        }

        .alert {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .empty-row td {
            text-align: center;
            color: #999;
            padding: 40px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .card {
                padding: 16px;
            }
            
            th, td {
                padding: 8px;
                font-size: 0.8rem;
            }
            
            .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Form Card -->
        <div class="card">
            <h1>📋 Data Yayasan</h1>
            <div class="subtitle">Form input data anak asuh & anak rentan</div>
            
            <div id="messageArea"></div>
            
            <div class="form-grid">
                <div class="form-group">
                    <label>Nama Anak Asuh *</label>
                    <input type="text" id="namaAsuh" placeholder="Masukkan nama anak asuh">
                </div>
                <div class="form-group">
                    <label>Nama Anak Rentan *</label>
                    <input type="text" id="namaRentan" placeholder="Masukkan nama anak rentan">
                </div>
                <div class="form-group">
                    <label>Jenjang Pendidikan *</label>
                    <select id="jenjang">
                        <option value="">Pilih jenjang</option>
                        <option value="SD">SD</option>
                        <option value="SMP">SMP</option>
                        <option value="SMA">SMA</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Jenis Kelamin *</label>
                    <select id="gender">
                        <option value="">Pilih jenis kelamin</option>
                        <option value="Laki-laki">Laki-laki</option>
                        <option value="Perempuan">Perempuan</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Biaya Diterima (Otomatis)</label>
                    <input type="text" id="biaya" readonly value="Rp 0">
                </div>
            </div>
            
            <button class="btn" onclick="simpanData()">💾 Simpan Data</button>
        </div>
        
        <!-- Data Table Card -->
        <div class="card">
            <h2>📊 Seluruh Data Anak</h2>
            <div class="subtitle">Data yang sudah tersimpan di Google Sheets</div>
            
            <div class="filter-section">
                <label>🔍 Filter Jenjang Pendidikan:</label>
                <select id="filterJenjang" class="filter-select" onchange="loadData()">
                    <option value="all">Semua</option>
                    <option value="SD">SD</option>
                    <option value="SMP">SMP</option>
                    <option value="SMA">SMA</option>
                </select>
            </div>
            
            <div class="table-wrapper">
                <table id="dataTable">
                    <thead>
                        <tr>
                            <th>Nama Anak Asuh</th>
                            <th>Nama Anak Rentan</th>
                            <th>Jenjang</th>
                            <th>Jenis Kelamin</th>
                            <th>Biaya Diterima</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <tr class="empty-row">
                            <td colspan="5">Loading data...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // =============== KONFIGURASI ===============
        const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyXSRzKsPKxbHmIz9rmF42WzXysMRHMejB_pIDRjtIiIYKuaN7or7LyDBzMZBde_Thi/exec";
        
        // Mapping biaya berdasarkan jenjang
        const biayaMapping = {
            "SD": "Rp 300.000",
            "SMP": "Rp 400.000",
            "SMA": "Rp 500.000"
        };
        
        // =============== OTOMATIS BIAYA ===============
        document.getElementById("jenjang").addEventListener("change", function() {
            const jenjang = this.value;
            const biayaField = document.getElementById("biaya");
            if (jenjang && biayaMapping[jenjang]) {
                biayaField.value = biayaMapping[jenjang];
            } else {
                biayaField.value = "Rp 0";
            }
        });
        
        // =============== FUNGSI TAMPIL PESAN ===============
        function showMessage(text, type) {
            const messageArea = document.getElementById("messageArea");
            messageArea.innerHTML = `<div class="alert alert-${type}">${text}</div>`;
            setTimeout(() => {
                messageArea.innerHTML = "";
            }, 3000);
        }
        
        // =============== SIMPAN DATA ===============
        async function simpanData() {
            const namaAsuh = document.getElementById("namaAsuh").value.trim();
            const namaRentan = document.getElementById("namaRentan").value.trim();
            const jenjang = document.getElementById("jenjang").value;
            const gender = document.getElementById("gender").value;
            const biaya = document.getElementById("biaya").value;
            
            // Validasi
            if (!namaAsuh || !namaRentan || !jenjang || !gender) {
                showMessage("Harap isi semua field yang wajib (*)", "error");
                return;
            }
            
            const data = {
                action: "add",
                namaAsuh: namaAsuh,
                namaRentan: namaRentan,
                jenjang: jenjang,
                gender: gender,
                biaya: biaya,
                timestamp: new Date().toISOString()
            };
            
            try {
                showMessage("Menyimpan data...", "success");
                const response = await fetch(APPS_SCRIPT_URL, {
                    method: "POST",
                    mode: "no-cors", // Penting untuk Google Apps Script
                    headers: {
                        "Content-Type": "application/json",
                    },
                    body: JSON.stringify(data)
                });
                
                showMessage("✅ Data berhasil disimpan!", "success");
                
                // Reset form (kecuali biaya)
                document.getElementById("namaAsuh").value = "";
                document.getElementById("namaRentan").value = "";
                document.getElementById("jenjang").value = "";
                document.getElementById("gender").value = "";
                document.getElementById("biaya").value = "Rp 0";
                
                // Reload data
                setTimeout(loadData, 1000);
                
            } catch (error) {
                console.error("Error:", error);
                showMessage("❌ Gagal menyimpan data. Periksa koneksi atau URL Apps Script.", "error");
            }
        }
        
        // =============== LOAD & TAMPIL DATA ===============
        async function loadData() {
            const filter = document.getElementById("filterJenjang").value;
            const tableBody = document.getElementById("tableBody");
            tableBody.innerHTML = '<tr class="empty-row"><td colspan="5">Loading data...</td></tr>';
            
            try {
                const url = `${APPS_SCRIPT_URL}?action=get&filter=${filter}`;
                const response = await fetch(url);
                const data = await response.json();
                
                if (!data || data.length === 0) {
                    tableBody.innerHTML = '<tr class="empty-row"><td colspan="5">Belum ada data. Silakan tambah data baru.</td></tr>';
                    return;
                }
                
                // Tampilkan data
                tableBody.innerHTML = "";
                data.forEach(row => {
                    const tr = document.createElement("tr");
                    tr.innerHTML = `
                        <td>${escapeHtml(row.namaAsuh)}</td>
                        <td>${escapeHtml(row.namaRentan)}</td>
                        <td>${escapeHtml(row.jenjang)}</td>
                        <td>${escapeHtml(row.gender)}</td>
                        <td>${escapeHtml(row.biaya)}</td>
                    `;
                    tableBody.appendChild(tr);
                });
                
            } catch (error) {
                console.error("Error loading data:", error);
                tableBody.innerHTML = '<tr class="empty-row"><td colspan="5">Gagal memuat data. Periksa URL Apps Script.</td></tr>';
            }
        }
        
        // Helper untuk keamanan XSS
        function escapeHtml(str) {
            if (!str) return "";
            return str.replace(/[&<>]/g, function(m) {
                if (m === "&") return "&amp;";
                if (m === "<") return "&lt;";
                if (m === ">") return "&gt;";
                return m;
            });
        }
        
        // Load data saat halaman dibuka
        loadData();
    </script>
</body>
</html>
