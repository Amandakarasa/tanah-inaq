<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Yayasan - Sistem Login</title>
    <style>
        /* style sama seperti sebelumnya */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #667eea; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; }
        .card { background: white; border-radius: 16px; padding: 24px; margin-bottom: 20px; }
        input, select { width: 100%; padding: 10px; margin: 8px 0 16px; border: 1px solid #ddd; border-radius: 8px; }
        button { background: #667eea; color: white; padding: 12px 24px; border: none; border-radius: 8px; cursor: pointer; }
        button:hover { background: #5a67d8; }
        .btn-hapus { background: #e53e3e; padding: 6px 12px; font-size: 12px; }
        .btn-hapus:hover { background: #c53030; }
        .btn-logout { background: #e53e3e; padding: 8px 16px; font-size: 14px; margin-left: 10px; }
        .btn-logout:hover { background: #c53030; }
        .btn-admin { background: #38a169; padding: 8px 16px; font-size: 14px; margin-left: 10px; }
        .btn-admin:hover { background: #2f855a; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background: #667eea; color: white; }
        .error { color: red; }
        .success { color: green; }
        .login-container { 
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .login-card {
            background: white;
            padding: 40px;
            border-radius: 16px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        .login-card h2 {
            text-align: center;
            margin-bottom: 24px;
            color: #333;
        }
        .login-card input {
            margin-bottom: 20px;
        }
        .login-card button {
            width: 100%;
            margin-top: 10px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .header h2 {
            margin: 0;
        }
        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .user-info span {
            color: #666;
        }
        .main-content {
            display: none;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 16px;
            width: 90%;
            max-width: 500px;
        }
        .modal-content h3 {
            margin-bottom: 20px;
        }
        .modal-content input {
            margin-bottom: 15px;
        }
        .modal-buttons {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 20px;
        }
        .user-list {
            margin: 20px 0;
            max-height: 300px;
            overflow-y: auto;
        }
        .user-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            border-bottom: 1px solid #ddd;
        }
        .user-item button {
            padding: 5px 10px;
            font-size: 12px;
        }
    </style>
</head>
<body>
<!-- Halaman Utama -->
<div id="mainPage" class="main-content">
    <div class="container">
        <div class="card">
            <div class="header">
                <h2>📋 Data Anak Asuh Yayasan</h2>
                <div class="user-info">
                    <span>👤 <span id="loggedUser"></span></span>
                    <button class="btn-admin" onclick="showUserManager()" id="adminBtn" style="display:none;">👑 Kelola User</button>
                    <button class="btn-logout" onclick="logout()">Logout</button>
                </div>
            </div>
            <div id="msg"></div>
            
            <div class="form-row">
                <div>
                    <label>👤 Nama Anak Asuh</label>
                    <input type="text" id="nama" placeholder="Nama lengkap anak asuh">
                </div>
                <div>
                    <label>🆔 No. Anak Asuh</label>
                    <input type="text" id="noAnak" placeholder="Nomor anak asuh">
                </div>
            </div>

            <div class="form-row">
                <div>
                    <label>👪 Nama Orang Tua Asuh</label>
                    <input type="text" id="ortuAsuh" placeholder="Nama orang tua asuh">
                </div>
                <div>
                    <label>📋 Nama Pendamping Lokal</label>
                    <input type="text" id="pendamping" placeholder="Nama pendamping lokal">
                </div>
            </div>

            <div class="form-row">
                <div>
                    <label class="required">📚 Jenjang Pendidikan</label>
                    <select id="jenjang">
                        <option value="">Pilih Jenjang</option>
                        <option value="SD">SD</option>
                        <option value="SD/MI">SD/MI</option>
                        <option value="SMP">SMP</option>
                        <option value="SMP/MTs">SMP/MTs</option>
                        <option value="SMPLB">SMPLB</option>
                        <option value="MTs">MTs</option>
                        <option value="SMA">SMA</option>
                        <option value="SMK">SMK</option>
                        <option value="MA">MA</option>
                        <option value="Universitas">Universitas</option>
                    </select>
                </div>
                <div>
                    <label class="required">📌 Status Anak</label>
                    <select id="status">
                        <option value="">Pilih Status</option>
                        <option value="Yatim Piatu">Yatim Piatu</option>
                        <option value="Yatim">Yatim</option>
                        <option value="Piatu">Piatu</option>
                        <option value="Disabilitas">Disabilitas</option>
                        <option value="Anak terlantar">Anak terlantar</option>
                        <option value="Anak dari keluarga tidak mampu">Anak dari keluarga tidak mampu</option>
                    </select>
                </div>
            </div>

            <div>
                <label class="required">💰 Nominal Sponsor</label>
                <input type="text" id="biaya" placeholder="Biaya sponsor" readonly>
            </div>

            <button onclick="simpan()">➕ Simpan Data</button>
        </div>
        
        <div class="card">
            <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; margin-bottom: 20px;">
                <h2>📊 Data Anak Asuh</h2>
                <div style="display: flex; gap: 10px;">
                    <select id="filter" onchange="loadData()">
                        <option value="all">Semua Jenjang</option>
                        <option value="SD">SD</option>
                        <option value="SMP">SMP</option>
                        <option value="SMA">SMA</option>
                        <option value="Universitas">Universitas</option>
                    </select>
                    <select id="filterStatus" onchange="loadData()">
                        <option value="all">Semua Status</option>
                        <option value="Yatim Piatu">Yatim Piatu</option>
                        <option value="Yatim">Yatim</option>
                        <option value="Piatu">Piatu</option>
                        <option value="Disabilitas">Disabilitas</option>
                    </select>
                </div>
            </div>
            <div style="overflow-x: auto;">
                <table id="tabel">
                    <thead>
                        <tr>
                            <th>NO</th>
                            <th>Nama Orang Tua Asuh</th>
                            <th>Nama Pendamping Lokal</th>
                            <th>No Anak Asuh</th>
                            <th>Nama Anak Asuh</th>
                            <th>Status</th>
                            <th>Jenjang Pendidikan</th>
                            <th>Nominal Sponsor</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>
                    <tbody><tr><td colspan="9">⏳ Loading...</td></tr>
                </tbody>
            </table>
            </div>
        </div>
    </div>
</div>

<!-- Modal Kelola User -->
<div id="userModal" class="modal">
    <div class="modal-content">
        <h3>👑 Kelola User</h3>
        <div id="userMsg"></div>
        <div class="user-list" id="userList"></div>
        <h4>Tambah User Baru</h4>
        <input type="text" id="newUsername" placeholder="Username baru">
        <input type="password" id="newPassword" placeholder="Password">
        <button onclick="addUser()">➕ Tambah User</button>
        <div class="modal-buttons">
            <button onclick="closeUserModal()">Tutup</button>
        </div>
    </div>
</div>
<script>
const API_URL = "https://script.google.com/macros/s/AKfycbxYECiLwB7b52sBxrI_qnv6JoP2GZ6bDMEqf6IxXo8b5EVpwqkqQnInLyKXJS2Rue0j/exec";

let USERS = JSON.parse(localStorage.getItem("yayasan_users")) || {
    "admin": "admin123",
    "yayasan": "yayasan2024",
    "pengurus": "pengurus123"
};

const biayaMap = { 
    "SD": "400000", "SD/MI": "400000", "SMP": "500000", "SMP/MTs": "500000",
    "SMPLB": "500000", "MTs": "500000", "SMA": "600000", "SMK": "600000",
    "MA": "500000", "Universitas": "600000"
};

function saveUsers() { localStorage.setItem("yayasan_users", JSON.stringify(USERS)); }

window.onload = function() {
    const isLoggedIn = sessionStorage.getItem("isLoggedIn");
    const username = sessionStorage.getItem("username");
    if (isLoggedIn === "true" && username) showMainPage(username);
    else showLoginPage();
};

function login() {
    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value;
    const loginMsg = document.getElementById("loginMsg");
    if (!username || !password) {
        loginMsg.innerHTML = "<div class='error'>⚠️ Isi username dan password!</div>";
        return;
    }
    if (USERS[username] && USERS[username] === password) {
        sessionStorage.setItem("isLoggedIn", "true");
        sessionStorage.setItem("username", username);
        showMainPage(username);
        loginMsg.innerHTML = "";
    } else {
        loginMsg.innerHTML = "<div class='error'>❌ Username atau password salah!</div>";
    }
}

function logout() {
    sessionStorage.clear();
    showLoginPage();
}

function showMainPage(username) {
    document.getElementById("loginPage").style.display = "none";
    document.getElementById("mainPage").style.display = "block";
    document.getElementById("loggedUser").innerText = username;
    if (username === "admin") document.getElementById("adminBtn").style.display = "inline-block";
    loadData();
}

function showLoginPage() {
    document.getElementById("loginPage").style.display = "flex";
    document.getElementById("mainPage").style.display = "none";
}

function showUserManager() {
    document.getElementById("userModal").style.display = "flex";
    refreshUserList();
}

function closeUserModal() {
    document.getElementById("userModal").style.display = "none";
}

function refreshUserList() {
    const userListDiv = document.getElementById("userList");
    userListDiv.innerHTML = "<h4>Daftar User:</h4>";
    for (let [username, password] of Object.entries(USERS)) {
        userListDiv.innerHTML += `
            <div class="user-item">
                <span><strong>${escapeHtml(username)}</strong> (${'*'.repeat(password.length)})</span>
                <div>
                    <button onclick="editUser('${username}')">✏️ Edit</button>
                    ${username !== 'admin' ? `<button onclick="deleteUser('${username}')" style="background:#e53e3e;">🗑️ Hapus</button>` : ''}
                </div>
            </div>
        `;
    }
}

function editUser(username) {
    const newPassword = prompt(`Edit password untuk user "${username}":`, USERS[username]);
    if (newPassword && newPassword.trim()) {
        USERS[username] = newPassword.trim();
        saveUsers();
        refreshUserList();
    }
}

function deleteUser(username) {
    if (confirm(`Hapus user "${username}"?`)) {
        delete USERS[username];
        saveUsers();
        refreshUserList();
    }
}

function addUser() {
    const newUsername = document.getElementById("newUsername").value.trim();
    const newPassword = document.getElementById("newPassword").value.trim();
    if (!newUsername || !newPassword) {
        document.getElementById("userMsg").innerHTML = "<div class='error'>⚠️ Isi semua field!</div>";
        return;
    }
    if (USERS[newUsername]) {
        document.getElementById("userMsg").innerHTML = "<div class='error'>⚠️ Username sudah ada!</div>";
        return;
    }
    USERS[newUsername] = newPassword;
    saveUsers();
    refreshUserList();
    document.getElementById("newUsername").value = "";
    document.getElementById("newPassword").value = "";
    document.getElementById("userMsg").innerHTML = "<div class='success'>✅ User berhasil ditambahkan!</div>";
}

function formatRupiah(angka) {
    if (!angka && angka !== 0) return "Rp 0";
    let number = String(angka).replace(/[^0-9]/g, '');
    if (!number || number === "0") return "Rp 0";
    return "Rp " + Number(number).toLocaleString('id-ID');
}

function cleanRupiah(rupiah) {
    if (!rupiah) return "0";
    return String(rupiah).replace(/[^0-9]/g, '');
}

document.getElementById("jenjang").onchange = function() {
    const biayaValue = biayaMap[this.value] || "400000";
    document.getElementById("biaya").value = formatRupiah(biayaValue);
};

async function simpan() {
    if (sessionStorage.getItem("isLoggedIn") !== "true") {
        alert("Sesi habis, silakan login kembali!");
        logout();
        return;
    }
    
    const noAnak = document.getElementById("noAnak").value.trim();
    const ortuAsuh = document.getElementById("ortuAsuh").value.trim();
    const pendamping = document.getElementById("pendamping").value.trim();
    const nama = document.getElementById("nama").value.trim();
    const status = document.getElementById("status").value;
    const jenjang = document.getElementById("jenjang").value;
    const biayaDisplay = document.getElementById("biaya").value;
    
    if (!nama || !jenjang || !status) {
        document.getElementById("msg").innerHTML = "<div class='error'>⚠️ Isi Nama, Jenjang, dan Status!</div>";
        return;
    }
    
    const biayaAngka = cleanRupiah(biayaDisplay);
    document.getElementById("msg").innerHTML = "<div>💾 Menyimpan...</div>";
    
    try {
        const response = await fetch(API_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ 
                action: "add", 
                noAnak: noAnak,
                ortuAsuh: ortuAsuh,
                pendamping: pendamping,
                namaAsuh: nama, 
                status: status,
                jenjang: jenjang, 
                biaya: biayaAngka 
            })
        });
        
        const result = await response.json();
        
        if (result.status === "success") {
            document.getElementById("msg").innerHTML = "<div class='success'>✅ " + result.message + "</div>";
            document.getElementById("noAnak").value = "";
            document.getElementById("ortuAsuh").value = "";
            document.getElementById("pendamping").value = "";
            document.getElementById("nama").value = "";
            document.getElementById("status").value = "";
            document.getElementById("jenjang").value = "";
            document.getElementById("biaya").value = "Rp 0";
            setTimeout(loadData, 1000);
        } else {
            document.getElementById("msg").innerHTML = "<div class='error'>❌ Gagal: " + result.message + "</div>";
        }
    } catch(e) {
        document.getElementById("msg").innerHTML = "<div class='error'>❌ Gagal menyimpan: " + e.message + "</div>";
    }
}

async function hapusData(index) {
    if (!confirm("Apakah Anda yakin ingin menghapus data ini?")) return;
    
    const msgDiv = document.getElementById("msg");
    msgDiv.innerHTML = "<div>🗑️ Menghapus...</div>";
    
    try {
        const response = await fetch(API_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ action: "delete", index: index })
        });
        const result = await response.json();
        
        if (result.status === "success") {
            msgDiv.innerHTML = "<div class='success'>✅ Data berhasil dihapus!</div>";
            setTimeout(loadData, 1000);
        } else {
            msgDiv.innerHTML = "<div class='error'>❌ " + result.message + "</div>";
        }
    } catch(e) {
        msgDiv.innerHTML = "<div class='error'>❌ Gagal: " + e.message + "</div>";
    }
}

function getStatusClass(status) {
    const map = {
        'Yatim Piatu': 'status-yatim-piatu',
        'Yatim': 'status-yatim',
        'Piatu': 'status-piatu',
        'Disabilitas': 'status-disabilitas'
    };
    return map[status] || 'status-lainnya';
}

async function loadData() {
    if (sessionStorage.getItem("isLoggedIn") !== "true") return;
    
    const filterJenjang = document.getElementById("filter").value;
    const filterStatus = document.getElementById("filterStatus").value;
    const tbody = document.querySelector("#tabel tbody");
    tbody.innerHTML = "<tr><td colspan='9'>⏳ Loading...</td></tr>";
    
    try {
        const url = `${API_URL}?action=get&filter=${filterJenjang}&filterStatus=${filterStatus}`;
        const response = await fetch(url);
        const data = await response.json();
        
        if (!data || data.length === 0) {
            tbody.innerHTML = "<tr><td colspan='9'>📭 Belum ada data</td></tr>";
            return;
        }
        
        tbody.innerHTML = "";
        for (let i = 0; i < data.length; i++) {
            const row = data[i];
            const statusClass = getStatusClass(String(row.status || ""));
            tbody.innerHTML += `
                <tr>
                    <td>${escapeHtml(String(row.no || i+1))}</td>
                    <td>${escapeHtml(String(row.ortuAsuh || ""))}</td>
                    <td>${escapeHtml(String(row.pendamping || ""))}</td>
                    <td>${escapeHtml(String(row.noAnak || ""))}</td>
                    <td><strong>${escapeHtml(String(row.namaAsuh || ""))}</strong></td>
                    <td><span class="status-badge ${statusClass}">${escapeHtml(String(row.status || ""))}</span></td>
                    <td>${escapeHtml(String(row.jenjang || ""))}</td>
                    <td>${formatRupiah(row.biaya || "0")}</td>
                    <td><button class="btn-hapus" onclick="hapusData(${i})">🗑️ Hapus</button></td>
                </tr>
            `;
        }
    } catch(e) {
        tbody.innerHTML = `<tr><td colspan='9'>❌ Error: ${e.message}</td></tr>`;
    }
}

function escapeHtml(str) {
    if (!str) return "";
    return String(str).replace(/[&<>]/g, function(m) {
        if (m === "&") return "&amp;";
        if (m === "<") return "&lt;";
        if (m === ">") return "&gt;";
        return m;
    });
}
</script>
</body>
</html>
